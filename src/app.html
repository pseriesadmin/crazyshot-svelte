<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Tilt+Warp&display=swap" rel="stylesheet" />
		<title>CRAZYSHOT — 비대면 AI 검수 렌탈 플랫폼</title>
		<meta name="description" content="국내 최초 카메라 장비 완전 비대면 대여 커머스" />

		<!-- PWA 매니페스트 + 아이콘 — iOS Safari 웹푸시는 "홈 화면에 추가"된 독립형 웹앱에서만
		     동작하는 플랫폼 제약이 있어(2026-08-19 진단, service-operations.md §15), 홈 화면 추가
		     자체가 가능하도록 최소 요건을 채운다. -->
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/svg+xml" href="/app-icons/logo-source.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/app-icons/icon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/app-icons/icon-16.png" />
		<link rel="apple-touch-icon" href="/app-icons/icon-180.png" />
		<meta name="theme-color" content="#271B7A" />
		<!-- iOS Safari는 apple- 접두 태그만 인식(표준 태그 무시) — 둘 다 유지.
		     Chrome은 apple- 접두 태그를 deprecated로 표시하며 표준 태그를 요구(2026-09-01). -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="크레이지샷" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
